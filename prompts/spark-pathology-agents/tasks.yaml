duplicate_detection:
  description: >
    Task description:
    **Input** 
      • A single idea to be evaluated for originality:
      {idea_temp}
    
      • A list of existing ideas:
      {idea_database_chunk}
    
    **Similarity assessment guidelines**
      - Biological Hypothesis:
        • Compare the scientific hypotheses. Ideas with similar biological aims or predictions 
        are more likely duplicates. Different hypotheses within the same general theme can be 
        considered more original.
      - Methodological Approach:
        • Evaluate the methods proposed to test the hypothesis. Ideas using the same analytical 
        method (e.g., clustering vs. density analysis) suggest higher similarity, while distinct 
        approaches can indicate originality.
      - Titles and Keywords:
        • Look for overlapping keywords or phrases. Shared terminology often points to conceptual 
        overlap, while unique language might suggest a novel angle.

      Scoring Guide 
        - You provide one single score for the whole idea. 
          • 9-10: High overlap in hypothesis, method, and parameters; likely a duplicate.
          • 5-8: Moderate overlap in a few aspects; likely original.
          • 0-4: Distinct hypothesis, method, or focus; original.
      
    **Analysis Steps**
      1. Comparison: Calculate a similarity score (0 to 10) for the new idea against 
         each of the existing ideas.
      2. Evaluation:
        • **ONLY IF any similarity score is greater than {similarity_rejection_threshold}, mark the new idea as a duplicate**.
        • Otherwise, mark the new idea as original.
        • If all scores are {similarity_rejection_threshold} or lower, mark it as original.
    
    **Additional considerations**
      • Empty List of Existing Ideas:
         • If the list is empty, return a similarity score as 0 and decision as original.

  expected_output: >
    A JSON-formatted list:
    {{
        "similarity_scores": [Similarity_score_1, Similarity_score_2, ..., Similarity_score_{chunk_number_ideas}],
        "decision": (duplicate or original)
    }}
    
    **Rules:**

    - **ABSOLUTELY NO additional text, explanations, or comments are allowed inside and outside the JSON object.**
    - Output must be a valid JSON list. Any deviation is not acceptable.

idea_refinement_he:
  description: >
    **Task Description**

        **Input:**
        
        - **Idea to Refine:** 
        
            {idea_refine}
        
        - **Idea Generation Principles:**
    
          - **Data Available:**
            - Cohorts of patients with malignant tumors.
            - Digitized whole-slide images (WSIs) of H&E-stained tumor sections.
            - No additional immunohistochemistry, gene expression, or sequencing data.
            - Two main types of processed data:
              1. **Tissue Segmentation Masks:**
                 - High-precision, pixel-wise, multi-class segmentation masks.
                 - Each pixel represents a class (integer-coded).
                 - Only tumor-associated classes are retained (epithelial and stromal tumor compartment); other regions are masked (pixel value 0).
                 - Tissue segmentation masks cannot be analysed separately and were only used to define in which compartment (epithelial
                   tumor compartment or tumor stroma compartment) each single cell is located. 
              2. **Single-Cell Detection & Classification:**
                 - All cells are detected (based on nucleus detection) and classified within tumor regions (epithelial and stromal compartments).
                 - Cell nuclei detections are stored as polygons in GeoJSON files.
                 - Cell classifications:
                   - Tumor cells
                   - Lymphocytes
                   - Plasma cells
                   - Macrophages
                   - Neutrophilic granulocytes
                   - Eosinophilic granulocytes
                   - Connective tissue cells (primarily cancer-associated fibroblasts)
                 - Enables feature extraction at the single-cell level and analysis of spatial relationships and more complex concepts 
                   among above mentioned different cell types.
                 - Additional features for single cells can be extracted from H&E images. This is possible as polygon coordinates are known.
    
        - **Relevant Python Code Structure:**
              1. **Cell Objects:**
                 - Each cell is stored as a `cell` object with properties:
                   - `index`: Index in the list of cells.
                   - `cell_class`: Cell type.
                   - `polygon`: Shapely polygon for cell nucleus (pixel coordinates in the original WSI) .
                   - `CentroidPix`: Centroid of the polygon (pixel coordinates in the WSI).
                   - `in_mask_set`: Tissue class the cell is in ("Tumor", "Stroma").
                        -"Tumor" - epithelial tumor compartment with tumor cells, seldom lymphocytes or other cells in close proximity of tumor cells.
                        -"Stroma" - tumor stroma, here all immune and stromal cells, no tumor cells. 
                   - `ImageColor`: Small Pillow RGB image containing the cell.
                   - `ImageGrey`: NumPy ndarray grayscale image containing the cell.
                   - `ImageMask`: NumPy ndarray with True/False values indicating cell object pixels in `ImageColor` and `ImageGrey`.
              2. **Patch Sampling:**
                 - Cells from WSIs are sampled in patches (e.g., 1 mm × 1 mm) using a sliding window to account for intratumoral heterogeneity.
                 - Each patch has a label whether if it stems from the tumor center (tumor interior) or invasion front (outer layer).
                   You don't need to compute where tumor center and invasion front are. This information will be provided later to the coding agent.
                 - Parameters are analyzed for cells present in each patch, and outputs are saved at the patch level (typically in CSV file). 
                 - If a parameter considers comparison of tumor center and invasion front - don't do this final comparison step yourself, just compute patch-level parameter values. 
                   Note: In such situations, the output is still patch-level parameter values. The comparison will be performed separately, outside of the script.
                 - Multiple images per patient case may exist. Subsequent aggregation from CSV files (e.g., for multiple images) is not part of this script.
              3. **Whole-Slide Analysis:**
                 - For analyses/parameters involving whole-slide images, larger patch sizes must be used (e.g., 20 mm × 20 mm).
        
        **Your Task:**
        - You receive a JSON-formatted idea. You have to refine analytical/methodological implementation.
        - Provide a concrete, step-by-step methodological approach aligned with the Python code structure above.
        - If the implementation cannot be realized within the Python script, mark the idea as non-feasible.
        - If the idea is too abstract and does not describe a clearly defined parameter, mark the idea as non-feasible.
        - Avoid such phrases as "potentially using" or "e.g." or "could involve" in implementation description, the implementation
          should be concrete and solid without any room for uncerainty or ambiguity.
        - Be so specific as possible. This refined methodological approach will be used by the coding agent to
          code a Python code snippet.
        - The starting point for implementation is described in Relevant Python Code Structure.
          Such tasks as loading whole-slide image, GeoJSON file, preprocessing the single cells from GeoJSON are already done.
          You are working with resulting cell objects.
        - Your ending point of implementation is saving the parameter values/outputs into csv files. All correlations 
          and further analysis involving survival endpoints are not in your scope.

  expected_output: >
        **Output:** 
        A JSON-formatted list:
          {{
          "decision_refinement": ("feasible" or "non-feasible"),
          "decision_refinement_clarification": (Detailed reason if non-feasible),
          "implementation_steps": {{ #Additionally, if the decision is feasible
              "implementation_step_1": "Description of Step 1",
              "implementation_step_2": "Description of Step 2",
              ...
              "implementation_step_X": "Description of Step X"
              }}
          }}
                  
        **Rules:**
        - No text, explanations, or comments are allowed outside the JSON object.
        - Output must be a valid JSON list; any deviation is unacceptable.
        - Use as many implementation steps as necessary.

