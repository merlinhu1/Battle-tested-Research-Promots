idea_generation_B:
  description: >
    We have cohorts of patients with malignant tumors, specifically focused
    on a cohort of patients with {cancer_type}. For this cohort, we have access to 
    digitized whole-slide images of tumor sections stained with Hematoxylin & Eosin 
    (H&E) only. No additional immunohistochemistry, gene expression, or sequencing data 
    is available, and we cannot validate with public datasets.
    
    Two main types of processed data are available:

    1) Tissue Segmentation Masks: A high-precision, pixel-wise, multi-class tissue
    segmentation algorithm was employed to generate masks for these slides. 
    Each pixel in these masks corresponds to a tissue class (integer-coded). Only two tumor-associated 
    classes—epithelial tumor compartment (i.e., tumor cells) and tumor stroma compartment—were retained; 
    all other classes, including background, are masked (pixel value of 0). Tissue segmentation 
    masks cannot be analysed separately and were only used to define in which compartment (epithelial
    tumor compartment or tumor stroma compartment) each single cell is located. 

    2) Single-Cell Detection & Classification: A second algorithm was employed to detect and classify
    all cells within epithelial and stromal tumor compartments. Cells detected outside these regions 
    (e.g., in necrotic debris, mucin, or tertiary lymphoid structures) were excluded. Detected cell nuclei 
    are stored as polygons in a GeoJSON file with single cell type classifications as follows:

        - Tumor cells
        - Lymphocytes
        - Plasma cells
        - Macrophages
        - Neutrophilic granulocytes
        - Eosinophilic granulocytes
        - Connective tissue cells (primarily cancer-associated fibroblasts)
    
    This data enables both feature extraction at the single-cell level and analysis of spatial relationships 
    among different cell types.

    **Instructions**:
  
    - You are prompted to generate ideas that explore methods and hypotheses to
      analyse the cells mentioned above for predicting patient survival or tumor progression. 
    - Each idea can involve one (e.g., only tumor cells or only lymphocytes) or multiple cell types
      (e.g., tumor cells + lymphocytes + macrophages). The example of most advanced constellation concerning
      number of cell types involved in an idea is an idea building a parameter involving all seven cell types.
    - One idea is always only one resulting parameter.
    - When proposing ideas that involve morphometric parameters, focus on one specific parameter for 
      each idea. For example, instead of saying “analyze cell nuclei parameters,” specify a single parameter 
      like “analyze the maximal axis length of cell nuclei” or “analyze the area of cell nuclei.” 
      These examples are abstract and meant to illustrate the principle of concentrating on one parameter 
      when discussing morphometry, regardless of the specific cell type(s) involved.
    - Ensure that each idea is as concrete and detailed as possible. Avoid abstractions and generalizations. 
      Provide clear, specific formulations that leave no room for ambiguity.
    - Consider the meaningful cytological features for the cells of a single type that can be extracted from the polygons.
    - Consider that the GeoJSON files with single-cell detections and classifications are associated with the original H&E-stained images. 
      This means that additional features for single cells can be extracted from the H&E images since the 
      coordinates of their locations are known (polygons in the GeoJSON files).
    - Even if we have only one time point in our data, ideas involving temporal aspect are still possible. Consider, 
      that different regions within single tumors are sub-clones that evolved from ancestor cell populations and, therefore, 
      represent indirectly a temporal dimension in our data. 
   
    **Definitions for output**:
    
    - **Idea title**: should clearly explain the parameter and involved cell types as this will be used later
      for duplicate detection.
    
    - **Cell type code**: Single code for cells involved in idea.
      - Use following abbreviations:
            T: tumor cells
            L: lymphocytes
            P: plasma cells
            M: macrophages 
            N: Neutrophilic granulocytes
            E: Eosinophilic granulocytes
            F: Connective tissue cells (primarily cancer-associated fibroblasts)
      - To generate a single code for output field "cell_type_code" use following principle:
            E.g., idea involves only lymphocytes. Code: "L".
            E.g., idea involves tumor cells, macrophages, and plasma cells. Code: "TMP".
    
    - **Estimated Complexity**: Rate the complexity of implementing the idea on a scale of 0 to 10. 
      - *0* means minimal complexity, with straightforward calculations or analyses.
      - *10* indicates high complexity, requiring advanced modeling or multiple processing steps.
      - Consider factors such as the data preparation involved, analytical difficulty,
        Python script programming, and computational resources required.
    
    - **Parameter Type**: Specify the type of primary data or feature used in the analysis.
      - *Cell Counting*: Focuses on counting cell types, such as the number or proportion of certain cells.
      - *Spatial*: Relies on spatial features like cell proximity, density, or patterns of cell clustering.
      - *Other*: Encompasses additional features.
    
    - **Analysis Principle**: Describe the general approach needed for the analysis.
      - *Direct Measurement*: Involves straightforward, raw data analyses without complex transformations.
      - *Modelling Easy*: Requires modeling, but it is relatively simple (e.g., linear models, etc.).
      - *Modelling Hard*: Involves advanced or multi-step modeling (e.g., deep learning models, 
        cellular automata, complex multi-variable relationships, probabilistic models, etc.).
    
    **Titles of ideas already present in the database**
    
    {titles_existing_ideas_in_db}
    
    
    **Your Task**:
    
    -Generate {number_ideas} {idea_quality} ideas that explore methods and hypotheses to
     analyse these cells for predicting patient survival or tumor progression.
    -When generating ideas, you are free to choose any of the seven above mentioned cell types.
     However, each generated idea must involve {number_cell_types} distinct cell type(s).
     Choice of cell type(s) is at your discretion. 
    -Your ideas must not duplicate or significantly overlap with titles/ideas already in the database.
    -Each proposed idea should be directly related to the goal of understanding or predicting 
     patient survival or tumor progression.
    -Use existing ideas in the database to guide the discovery process systematically. 
    

  expected_output: >
    Provide a JSON-formatted list of ideas. Each idea should contain following parameters 
    (use the names of parameters exactly as defined below):
    
        - idea_number
        - idea_title
        - cancer_type: {cancer_type}
        - cell_type_code: (single code for cell types involved in idea)
        - biological_hypothesis
        - analytical_methodological_implementation
        - estimated_complexity: (0..10)
        - parameter_type: (e.g., cell counting, spatial, other)
        - analysis_principle: (e.g., direct measurement, modelling easy, modelling hard)
    
    **Rules:**

    - **No text, explanations, or comments are allowed outside the JSON object.**
    - Output must be a valid JSON list. Any deviation is not acceptable.
    - **ALWAYS** start numbering from idea_number 1 in the JSON, even if some ideas already exist in the database.
    - Note! Each generated idea must involve {number_cell_types} distinct cell type(s).
  
  
idea_generation_C:
  description: >
    We have cohorts of patients with malignant tumors, specifically focused
    on a cohort of patients with {cancer_type}. For this cohort, we have access to 
    digitized whole-slide images of tumor sections stained with Hematoxylin & Eosin 
    (H&E) only. No additional immunohistochemistry, gene expression, or sequencing data 
    is available, and we cannot validate with public datasets.
    
    Two main types of processed data are available:

    1) Tissue Segmentation Masks: A high-precision, pixel-wise, multi-class tissue
    segmentation algorithm was employed to generate masks for these slides. 
    Each pixel in these masks corresponds to a tissue class (integer-coded). Only two tumor-associated 
    classes—epithelial tumor compartment (i.e., tumor cells) and tumor stroma compartment—were retained; 
    all other classes, including background, are masked (pixel value of 0). Tissue segmentation 
    masks cannot be analysed separately and were only used to define in which compartment (epithelial
    tumor compartment or tumor stroma compartment) each single cell is located. 

    2) Single-Cell Detection & Classification: A second algorithm was employed to detect and classify
    all cells within epithelial and stromal tumor compartments. Cells detected outside these regions 
    (e.g., in necrotic debris, mucin, or tertiary lymphoid structures) were excluded. Detected cell nuclei 
    are stored as polygons in a GeoJSON file with single cell type classifications as follows:

        - Tumor cells
        - Lymphocytes
        - Plasma cells
        - Macrophages
        - Neutrophilic granulocytes
        - Eosinophilic granulocytes
        - Connective tissue cells (primarily cancer-associated fibroblasts)
    
    This data enables both feature extraction at the single-cell level and analysis of spatial relationships 
    among different cell types.
    
    **OBJECTIVE**
      Malignant tumors are lethal primarily because they metastasize. Once a tumor has spread to distant sites, 
      surgical resection alone can no longer prevent eventual fatality. However, if the tumor remains localized 
      and has not yet metastasized, surgical removal can be curative. For carcinomas (epithelial malignant tumors), 
      the most common route of metastasis is through lymphatic vessels into regional lymph nodes.
    
      Therefore, the key challenge is to determine which tumors have already metastasized and which have not. 
      The objective is to identify specific morphological features and the underlying biological mechanisms that can
      reliably indicate whether a carcinoma has metastasized.
        
    **Instructions: conceptual**:
  
    - You are prompted to generate ideas that explore methods and hypotheses to
      analyse the cells mentioned above in order to predict if a tumor has metastasized.
    - Your ideas may focus on just one cell type (e.g., tumor cells alone) or multiple cell types (e.g., tumor cells + lymphocytes + macrophages).
    - The most comprehensive approach might incorporate all seven cell types under consideration.
    - Consider the cellular dynamics and interactions among different cell types that enable tumor cells to enter 
      lymphatic vessels and spread to lymph nodes.
    - Analysis of tumor cell microenvironment might provide essential clues to metastatic behaviour.
    - Bear in mind the high heterogeneity of malignant tumors, which can evolve into multiple subclones with varying 
      aggressiveness. These subclones compete, adapt, and cooperate.
    - Often, only a small part of the tumor acquires the features necessary for metastatic spread.
    - These features may be evident in one focal area of the tumor (unifocal) or in multiple areas simultaneously (multifocal).
    - Think about key signaling pathways (e.g., angiogenesis, stroma induction, immune escape) and how these affect 
      cellular morphology and spatial organization of the cells in context of metastatic spread. 
    
    **Instructions: methodology**:
    
    - One idea is always only one resulting parameter.
    - Ensure that each idea is as concrete and detailed as possible. Avoid abstractions and generalizations. 
      Provide clear, specific formulations that leave no room for ambiguity.
    - Consider the meaningful cytological features for the cells of a single type that can be extracted from the polygons.
    - Consider that the GeoJSON files with single-cell detections and classifications are associated with the original H&E-stained images. 
      This means that additional features for single cells can be extracted from the H&E images since the 
      coordinates of their locations are known (polygons in the GeoJSON files).
    - Even if we have only one time point in our data, ideas involving temporal aspect are still possible. Consider, 
      that different regions within single tumors are sub-clones that evolved from ancestor cell populations and, therefore, 
      represent indirectly a temporal dimension in our data. 
    - Consider, that we cannot analyse vessels or endothelial cells, only fibroblasts in stroma.
   
    **Definitions for output**:
    
    - **Idea title**: should clearly explain the idea/parameter and involved cell types as this will be used later
      for duplicate detection.
    
    - **Cell type code**: Single code for cells involved in idea.
      - Use following abbreviations:
            T: tumor cells
            L: lymphocytes
            P: plasma cells
            M: macrophages 
            N: Neutrophilic granulocytes
            E: Eosinophilic granulocytes
            F: Connective tissue cells (primarily cancer-associated fibroblasts)
      - To generate a single code for output field "cell_type_code" use following principle:
            E.g., idea involves only lymphocytes. Code: "L".
            E.g., idea involves tumor cells, macrophages, and plasma cells. Code: "TMP".
    
    - **Estimated Complexity**: Rate the complexity of implementing the idea on a scale of 0 to 10. 
      - *0* means minimal complexity, with straightforward calculations or analyses.
      - *10* indicates high complexity, requiring advanced modeling or multiple processing steps.
      - Consider factors such as the data preparation involved, analytical difficulty,
        Python script programming, and computational resources required.
    
    - **Parameter Type**: Specify the type of primary data or feature used in the analysis.
      - *Cell Counting*: Focuses on counting cell types, such as the number or proportion of certain cells.
      - *Spatial*: Relies on spatial features like cell proximity, density, or patterns of cell clustering.
      - *Other*: Encompasses additional features.
    
    - **Analysis Principle**: Describe the general approach needed for the analysis.
      - *Direct Measurement*: Involves straightforward, raw data analyses without complex transformations.
      - *Modelling Easy*: Requires modeling, but it is relatively simple (e.g., linear models, etc.).
      - *Modelling Hard*: Involves advanced or multi-step modeling (e.g., deep learning models, 
        cellular automata, complex multi-variable relationships, probabilistic models, etc.).
    
    **Titles of ideas already present in the database**
    
    {titles_existing_ideas_in_db}
    
    
    **Your Task**:
    
    -Generate {number_ideas} {idea_quality} ideas that explore methods and hypotheses to
     analyse the above mentioned seven cell types for predicting if a malignant tumor has metastasized.
    -When generating ideas/parameters, you are free to choose any of the seven above mentioned cell types.
    -Your ideas may focus on just one cell type (e.g., tumor cells alone) or multiple cell types (e.g., tumor cells + lymphocytes + macrophages).
    -Your ideas must not duplicate or significantly overlap with titles/ideas already in the database.
    -Each proposed idea should be directly related to the goal of understanding or predicting 
     metastatic spread.
    -Use existing ideas in the database to guide the discovery process systematically. 

  expected_output: >
    Provide a JSON-formatted list of ideas. Each idea should contain following parameters 
    (use the names of parameters exactly as defined below):
    
        - idea_number
        - idea_title
        - cancer_type: {cancer_type}
        - cell_type_code: (single code for cell types involved in idea)
        - biological_hypothesis
        - analytical_methodological_implementation
        - estimated_complexity: (0..10)
        - parameter_type: (e.g., cell counting, spatial, other)
        - analysis_principle: (e.g., direct measurement, modelling easy, modelling hard)
    
