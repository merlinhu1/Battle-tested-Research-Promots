list_formatting:
  description: >
    **Task background**
    
      - We have cohort of patients with different malignant tumors. For this cohort, we have access to 
      digitized whole-slide images of tumor sections stained with Hematoxylin & Eosin 
      (H&E) only. No additional immunohistochemistry, gene expression, or sequencing data 
      is available, and we cannot validate with public datasets.

      Two main types of processed data are available:

      1) Tissue Segmentation Masks: A high-precision, pixel-wise, multi-class tissue
      segmentation algorithm has generated masks for these slides, saved as PNG files. 
      Each pixel in these masks represents a class (integer-coded). Only tumor-associated 
      classes (e.g., epithelial tumor tissue, tumor stroma, necrotic debris, mucin,
      tertiary lymphoid structures) are retained; all other regions, including background, 
      are masked (assigned a pixel value of 0).

      2) Single-Cell Detection & Classification: A second algorithm detects and classifies
      all cells within the tumor regions, specifically in the epithelial and stromal compartments. 
      Cells detected outside these regions (e.g., in necrotic debris, mucin, or tertiary lymphoid
      structures) are excluded. Detected cell nuclei are stored as polygons in a GeoJSON file
      with classifications as follows:

          - Tumor cells
          - Lymphocytes
          - Plasma cells
          - Macrophages
          - Neutrophilic granulocytes
          - Eosinophilic granulocytes
          - Connective tissue cells (primarily cancer-associated fibroblasts)

      This data enables both feature extraction at the single-cell level and spatial relationships 
      among different cell types. 
    
      - Human pathologists were asked to formulate the ideas for prognostic parameters.
      These ideas are formulated very shortly and in German. 
      Here are several abstract examples:
      1) "Karzinomzellkerngröße". This means that pathologist wants to analyse the 
      size of tumor cell nuclei implying that area of the tumor cell nuclei might be important
      prognostic parameter for malignant tumors.
      2) "LZ/M Invasionsfront". This means that pathologist wants to analyse ratio between
      lymphocytes and plasmace cells at the invasion front of the tumor and considers that 
      this parameter has prognostic value in malignant tumors. 
    
      - Sometimes pathologists refer to previous ideas and use instructions for a group of ideas, 
      here is the abstract example:
     
      Text from pathologist:
        "Im Gesamttumor:
        1. Zellkerngröße.
        2. Zellkernform: rund/ovalär etc.
        3. Zellkernform: Irregularutät der Zellkernmembran
        4. Nukleolen: Größe
        5. Nukleolen: Anzahl
        6. Nukleolen: Farbe 
        7. Nukleolen: Lokalisation im Zellkern
  
        An der Invasionsfront:
        8.-15. Parameter 1-7."
    
      This means that parameters 8-15 are the same parameters as defined in
      parameters 1-7, however, not for the whole tumor (Parameters 1-7) but
      only for the invasion front of the tumor.
    
      - Note (IMPORTANT): if idea refers to previous parameter, always fully describe the parameter in a title without
      any references.
    
      Here is the abstract example of how to implement this:
        "
        12. LZ / (NGZ + EGZ) an der Invasionsfront.
        13. LZ / (NGZ + EGZ) im Tumorzentrum.
        14. Ratio Parameter 12 / 13.    
        "
        In this situation, the title for parameter 14 should be pronounced in full, for example:
          "Relationship between ratio of lymphocytes to sum of neutrophilic and eosinophilic granulocytes at invasion front and tumor center"
        
    **Input**
    
      This is a list of idea titles provided by one pathologist:
      
      {idea_title_list}
    
    **Instructions**
    
      - Here is the list of abbreviations used by pathologists for cells and some other definitions:
        LZ - lymphocyte
        M - macrophage
        NGZ - neutrophilic granulocyte
        EGZ - eosinophilic granulocyte
        PZ - plasma cell
        F - fibroblast
        TZ - tumor cell
        TSR - tumor-stroma ratio
        L1 - invasion of lymphatic vessels
        TLS - tertiary lymphoid structures
      - Provide a clear exhaustive title for each idea in English.
      The parameter/idea must be perfectly clear defined not leaving any place for ambiguity
      of how the idea/parameter should be implemented. This title will be used later by other agents 
      to formulate a detailed technical implementation.
      - If idea implies several parameters, these should be split as separate idea titles
      The rule is: one title = one clearly defined idea/parameter.
      - Use consecutive numbering for ideas.

