idea_review_D:
  description: >
    **Initial description of available data**

          *Cohort and tissue microarray*

          We have cohorts of patients with malignant tumors, specifically focused
          on a cohort of patients with {cancer_type}. For this cohort a tissue microarray (TMA) was 
          constructed from tumor tissue. Each tumor is a primary tumor, not metastasis. This TMA usually 
          includes one tissue spot for each tumor.

          *Imaging*

          This TMA was analysed using multiplexed imaging with a panel that includes multiple markers allowing
          the differentiation between different cell populations. 

          The images were later digitized and preprocessed to map different cell types. Here are several abstract examples:
          -A cell expresses pan-cytokeratin - this is a tumor cell. 
          -A cell expresses CD3 and CD8 - this is cytotoxic T-lymphocyte.

          *Data modalities*

          No additional gene expression or sequencing data is available, and we cannot validate with public datasets.

          Two main types of processed data are available:

          1) Tissue Structure Segmentation Masks. Several types of tissue structures are available from image analysis:
              - Vessels (can be analysed directly)
              - Epithelial structures (cannot be analysed directly, but were used to classify the position of single cells)
      

          2) Single-Cell Detection & Classification Masks. Based on expression patterns several types of cells were detected
          and classified in the images. All cells were processed in each image. Following cell types are present in the masks:
              - Tumor cells: epithelial tumor cells
              - Cytotoxic T lymphocytes: CD8+ T lymphocytes
              - Helper T lymphocytes: CD4+/FOXP3- T lymphocytes
              - Regulatory T lymphocytes: CD4+/FOXP3+ T lymphocyte
              - B Lymphocytes
              - Plasma cells
              - Macrophages
              - Granulocytes: eosinophilic and neutrophilic granulocytes together
              - Myofibroblasts PDPN+
              - Myofibroblasts: all other, PDPN-
              - Fibroblasts FSP1+
              - Fibroblasts: all other, FSP1-
              - Endothelial cells
              - Antigen presenting cells (APC)

          Note: a) Cells where exact classification was not possible are masked and not relevant for your task. b) both vessel masks 
           and single-cell detection & classification masks are stored in one GeoJSON file as polygons. c) The detection of the cells 
           is based on the nucleus, and polygons in GeoJSON file represent nuclei. d) For each cell (based on the above mentioned
           mapping of epithelial structures) is known if it resides within epithelial or stromal compartment. 
           e) PDPN+ (Podoplanin) myofibroblasts are a subset of myofibroblasts that were associated with tumor progression,
           vessel invasion, and other negative events in malignant epithelial tumors. f) FSP1+ fibroblasts are a subset
           of fibroblasts associated with inflammation, tissue remodelling, epithelial-to-mesenchymal transition of cells,
           and some other processes, presumably contributing to tumor progression.

          *Analysis possibilities*

          This data enables both feature extraction at the single-cell level and analysis of spatial relationships 
          among different cell types and tissue structures.

    **Initial instructions that were used for Idea Generation process**

        - You are prompted to generate ideas that explore methods and hypotheses to
          analyse the cells and/or tissue structures mentioned above for predicting patient survival or tumor progression. 
        - Each idea can involve one (e.g., only tumor cells or only lymphocytes) or multiple cell types
          (e.g., tumor cells + cytotoxic T lymphocytes + macrophages). The example of most advanced constellation concerning
          number of cell types involved in an idea is an idea building a parameter involving all fourteen cell types.
        - Each idea might or might not (then analysing only cells) use abovementioned tissue structures.
        - Some cells stem from one cell type (for example, PDPN+ myofibroblasts and other fibroblasts) and might be merged, 
          if necessary for analysis. 
        - One idea is always only one resulting parameter.
        - When proposing ideas that involve morphometric parameters, focus on one specific parameter for 
          each idea. For example, instead of saying “analyze cell nuclei parameters,” specify a single parameter 
          like “analyze the maximal axis length of cell nuclei” or “analyze the area of cell nuclei.” 
          These examples are abstract and meant to illustrate the principle of concentrating on one parameter 
          when discussing morphometry, regardless of the specific cell type(s) involved.
        - Ensure that each idea is as concrete and detailed as possible. Avoid abstractions and generalizations. 
          Provide clear, specific formulations that leave no room for ambiguity.
        - Consider the meaningful cytological features for the cells of a single type that can be extracted from the polygons.
        - Consider that the GeoJSON files are not associated with the original H&E-stained images or multiplexed images. 
          This means that no additional features for single cells can be extracted from such images. You work only with 
          GeoJSONs.
    
    **Initial definitions that were used for Idea Generation output**

        - **Idea title**: should clearly explain the parameter and involved cell types as this will be used later
          for duplicate detection.

        - **Cell type code**: Single code for cells involved in idea.
          - Use following abbreviations:
                TU: Tumor cells
                Tc: Cytotoxic T lymphocytes
                Th: Helper T lymphocytes
                Treg: Regulatory T lymphocytes
                B: B Lymphocytes
                P: Plasma cells
                M: Macrophages
                G: Granulocytes
                MFp: Myofibroblasts PDPN+
                MF: Myofibroblasts - all other, PDPN-
                Ff: Fibroblasts FSP1+
                F: Fibroblasts - all other, FSP1-
                E: Endothelial cells
                A: Antigen presenting cells (APC)

          - To generate a single code for output field "cell_type_code" use following principle:
                E.g., idea involves only B lymphocytes. Code: "B".
                E.g., idea involves tumor cells, macrophages, plasma cells, and FSP1+ fibroblasts. Code: "TU,M,P,Ff".

        - **Estimated Complexity**: Rate the complexity of implementing the idea on a scale of 0 to 10. 
          - *0* means minimal complexity, with straightforward calculations or analyses.
          - *10* indicates high complexity, requiring advanced modeling or multiple processing steps.
          - Consider factors such as the data preparation involved, analytical difficulty,
            Python script programming, and computational resources required.

        - **Parameter Type**: Specify the type of primary data or feature used in the analysis.
          - *Cell Counting*: Focuses on counting cell types, such as the number or proportion of certain cells.
          - *Spatial*: Relies on spatial features like cell proximity, density, or patterns of cell clustering.
          - *Other*: Encompasses additional features.

        - **Analysis Principle**: Describe the general approach needed for the analysis.
          - *Direct Measurement*: Involves straightforward, raw data analyses without complex transformations.
          - *Modelling Easy*: Requires modeling, but it is relatively simple (e.g., linear models, etc.).
          - *Modelling Hard*: Involves advanced or multi-step modeling (e.g., deep learning models, 
            cellular automata, complex multi-variable relationships, probabilistic models, etc.).
    
    **Format that was defined for Idea Generation Output**:
