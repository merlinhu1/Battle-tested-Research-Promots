idea_formulation:
  description: >
    We have cohorts of patients with malignant tumors, specifically focused
      on a cohort of patients with {cancer_type}. For this cohort, we have access to 
      digitized whole-slide images of tumor sections stained with Hematoxylin & Eosin 
      (H&E) only. No additional immunohistochemistry, gene expression, or sequencing data 
      is available, and we cannot validate with public datasets.

      Two main types of processed data are available:

      1) Tissue Segmentation Masks: A high-precision, pixel-wise, multi-class tissue
      segmentation algorithm has generated masks for these slides, saved as PNG files. 
      Each pixel in these masks represents a class (integer-coded). Only tumor-associated 
      classes (e.g., epithelial tumor tissue, tumor stroma, necrotic debris, mucin,
      tertiary lymphoid structures) are retained; all other regions, including background, 
      are masked (assigned a pixel value of 0).

      2) Single-Cell Detection & Classification: A second algorithm detects and classifies
      all cells within the tumor regions, specifically in the epithelial and stromal compartments. 
      Cells detected outside these regions (e.g., in necrotic debris, mucin, or tertiary lymphoid
      structures) are excluded. Detected cell nuclei are stored as polygons in a GeoJSON file
      with classifications as follows:

          - Tumor cells
          - Lymphocytes
          - Plasma cells
          - Macrophages
          - Neutrophilic granulocytes
          - Eosinophilic granulocytes
          - Connective tissue cells (primarily cancer-associated fibroblasts)

      This data enables both feature extraction at the single-cell level and spatial relationships 
      among different cell types, including:
        - meaningful cytological features for the cells of single types that can be extracted from the polygons.
        - GeoJSON files with single-cell detections and classifications, 
          along with the tissue segmentation maps, are associated with the original H&E-stained images. 
          This means additional features for single cells can be extracted from the H&E images since the 
          coordinates of their locations are known (polygons in the GeoJSON files).
          
      **Definitions**:
      - **Cell type code**: Single code for cells involved in idea.
        - Use following abbreviations:
              T: tumor cells
              L: lymphocytes
              P: plasma cells
              M: macrophages 
              N: Neutrophilic granulocytes
              E: Eosinophilic granulocytes
              F: Connective tissue cells (primarily cancer-associated fibroblasts)
        - To generate a single code for output field "cell_type_code" use following principle:
              E.g., idea involves only lymphocytes. Code: "L".
              E.g., idea involves tumor cells, macrophages, and plasma cells. Code: "TMP".

      - **Estimated Complexity**: Rate the complexity of implementing the idea on a scale of 0 to 10. 
        - *0* means minimal complexity, with straightforward calculations or analyses.
        - *10* indicates high complexity, requiring advanced modeling or multiple processing steps.
        - Consider factors such as the data preparation involved, analytical difficulty,
          Python script programming, and computational resources required.

      - **Parameter Type**: Specify the type of primary data or feature used in the analysis.
        - *Cell Counting*: Focuses on counting cell types, such as the number or proportion of certain cells.
        - *Spatial*: Relies on spatial features like cell proximity, density, or patterns of cell clustering.
        - *Other*: Encompasses additional features.

      - **Analysis Principle**: Describe the general approach needed for the analysis.
        - *Direct Measurement*: Involves straightforward, raw data analyses without complex transformations.
        - *Modelling Easy*: Requires modeling, but it is relatively simple (e.g., linear models, etc.).
        - *Modelling Hard*: Involves advanced or multi-step modeling (e.g., deep learning models, 
          cellular automata, complex multi-variable relationships, probabilistic models, etc.).

      **Titles of ideas provided by pathologists**

      {idea_title_chunk}

      **Your Task**:
      
      -You work with ideas (idea titles) provided by pathologists to formulate them according to guidelines
      provided below in a standardized way. 
      -Avoid abstractions and generalizations. Provide clear, specific formulations that leave no room for ambiguity.
    

  expected_output: >
      Provide a JSON-formatted list of ideas for supplied idea titles. 
      Each idea should contain following parameters (use the names of parameters exactly as defined below):

          - idea_number: (use same number as provided above)
          - idea_title: (use same title as provided above)
          - cell_type(s): (according to instruction provided above)
          - biological_hypothesis: (formulate biological hypothesis)
          - analytical_methodological_implementation: (formulate according to data available)
          - estimated_complexity: (0..10)
          - parameter_type: (e.g., cell counting, spatial, other)
          - analysis_principle: (e.g., direct measurement, modelling easy, modelling hard)

      **Rules:**

      - **No text, explanations, or comments are allowed outside the JSON object.**
      - Output must be a valid JSON list. Any deviation is not acceptable.  

