      all cells within the tumor regions, specifically in the epithelial and stromal compartments. 
      Cells detected outside these regions (e.g., in necrotic debris, mucin, or tertiary lymphoid 
      structures) are excluded. Detected cell nuclei are stored as polygons (coordinates) in a 
      GeoJSON file with classifications as follows:

          - Tumor cells
          - Lymphocytes
          - Plasma cells
          - Macrophages
          - Neutrophilic granulocytes
          - Eosinophilic granulocytes
          - Connective tissue cells (primarily cancer-associated fibroblasts)

      This data enables both feature extraction at the single-cell level and spatial relationships 
      among different cell types.
    
    **OBJECTIVE**
      Malignant tumors are lethal primarily because they metastasize. Once a tumor has spread to distant sites, 
      surgical resection alone can no longer prevent eventual fatality. However, if the tumor remains localized 
      and has not yet metastasized, surgical removal can be curative. For carcinomas (epithelial malignant tumors), 
      the most common route of metastasis is through lymphatic vessels into regional lymph nodes.

      Therefore, the key challenge is to determine which tumors have already metastasized and which have not. 
      The objective is to identify specific morphological features and the underlying biological mechanisms that can
      reliably indicate whether a carcinoma has metastasized.
    
    **Instructions that were used for Idea Generation process: conceptual**:

      - You are prompted to generate ideas that explore methods and hypotheses to
        analyse the cells mentioned above in order to predict if a tumor has metastasized.
      - Your ideas may focus on just one cell type (e.g., tumor cells alone) or multiple cell types (e.g., tumor cells + lymphocytes + macrophages).
      - The most comprehensive approach might incorporate all seven cell types under consideration.
      - Consider the cellular dynamics and interactions among different cell types that enable tumor cells to enter 
        lymphatic vessels and spread to lymph nodes.
      - Analysis of tumor cell microenvironment might provide essential clues to metastatic behaviour.
      - Bear in mind the high heterogeneity of malignant tumors, which can evolve into multiple subclones with varying 
        aggressiveness. These subclones compete, adapt, and cooperate.
      - Often, only a small part of the tumor acquires the features necessary for metastatic spread.
      - These features may be evident in one focal area of the tumor (unifocal) or in multiple areas simultaneously (multifocal).
      - Think about key signaling pathways (e.g., angiogenesis, stroma induction, immune escape) and how these affect 
        cellular morphology and spatial organization of the cells in context of metastatic spread. 

    **Instructions that were used for Idea Generation process: methodology**:

      - One idea is always only one resulting parameter.
      - Ensure that each idea is as concrete and detailed as possible. Avoid abstractions and generalizations. 
        Provide clear, specific formulations that leave no room for ambiguity.
      - Consider the meaningful cytological features for the cells of a single type that can be extracted from the polygons.
      - Consider that the GeoJSON files with single-cell detections and classifications are associated with the original H&E-stained images. 
        This means that additional features for single cells can be extracted from the H&E images since the 
        coordinates of their locations are known (polygons in the GeoJSON files).
      - Even if we have only one time point in our data, ideas involving temporal aspect are still possible. Consider, 
        that different regions within single tumors are sub-clones that evolved from ancestor cell populations and, therefore, 
        represent indirectly a temporal dimension in our data. 
      - Consider, that we cannot analyse vessels or endothelial cells, only fibroblasts in stroma.
    
    **Definitions that were used for Idea Generation output**:
        - **Cell type code**: Single code for cells involved in idea.
          - Use following abbreviations:
                T: tumor cells
                L: lymphocytes
                P: plasma cells
                M: macrophages 
                N: Neutrophilic granulocytes
                E: Eosinophilic granulocytes
                F: Connective tissue cells (primarily cancer-associated fibroblasts)
          - To generate a single code for output field "cell_type_code" use following principle:
                E.g., idea involves only lymphocytes. Code: "L".
                E.g., idea involves tumor cells, macrophages, and plasma cells. Code: "TMP".
    
    **Format that was defined for Idea Generation Output**:
      Ideas should be presented as a JSON-formatted list, each containing:
        - idea_number
        - idea_title
        - cancer_type: {cancer_type}
        - cell_type_code: (single code for cell types involved in idea)
        - biological_hypothesis
        - analytical_methodological_implementation
        - estimated_complexity: (0..10)
        - parameter_type: (e.g., cell counting, spatial, other)
        - analysis_principle: (e.g., direct measurement, modelling easy, modelling hard)
    
    **Your Task**:
    - You will receive JSON-formatted ideas consecutively numbered.
    - These ideas explore how the cells (single or multiple cell types) can be analyzed to predict if a 
      malignant tumor has metastasized. 
    - Your task is to review each idea for adherence to above mentioned guidelines. Specifically:
      •	Ensure each idea adheres strictly to the data modalities (e.g., no use of non-available data like gene expression or non-available cell types).
      • If idea is related to morphometry of single cell type, it evaluates one single parameter.
      • The idea is not abstract and not too general and investigates a clear parameter.
      • If the idea involves temporal aspect, consider that the analysis is still possible, even if we have
        only one time point in our data. Different regions within single tumors are sub-clones that evolved
        from ancestor cell populations and therefore represent indirectly a temporal dimension in our data. 
      •	Reject ideas with significant guideline violations, such as omitted cell types or use of unavailable data modalities.

